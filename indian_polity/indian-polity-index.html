odule110-1571838592.pdf" }, { "name": "111_Authoritative_Text_of_the_Constitution_in_Hindi__Public_Services", "pdf": "111_Authoritative_Text_of_the_Constitution_in_Hindi__Public_Services/IndianPolityLectures-Module111-1572007019.pdf" }, { "name": "112_Tribunals__Rights_and_Liabilities_of_TheGovernment", "pdf": "112_Tribunals__Rights_and_Liabilities_of_TheGovernment/IndianPolityLectures-Module112-1572077881.pdf" }, { "name": "113_Rights_and_Liabilities_of_the_Government__Special_Provisions_Relating_to_certain_classes", "pdf": "113_Rights_and_Liabilities_of_the_Government__Special_Provisions_Relating_to_certain_classes/IndianPolityLectures-Module113-1572353480.pdf" }, { "name": "114_National_Emergency", "pdf": "114_National_Emergency/IndianPolityLectures-Module114-1572524057.pdf" }, { "name": "115_Emergency_provisions", "pdf": "115_Emergency_provisions/IndianPolityLectures-Module115-1572610271.pdf" }, { "name": "116_Pressure_Groups__Special_provisions_for_some_states", "pdf": "116_Pressure_Groups__Special_provisions_for_some_states/IndianPolityLectures-Module117-1572953514.pdf" }, { "name": "116_Inter_state_Relations", "pdf": "116_Inter_state_Relations/Indian Polity Lectures - Module 116.pdf" }, { "name": "39-Fundamental_Rights_Article_25_And_Sabarimala_Issue", "pdf": "39-Fundamental_Rights_Article_25_And_Sabarimala_Issue/India Polity Lectures - Module 39.pdf" }];

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.0;

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        // DOM Elements
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const topicList = document.getElementById('topicList');
        const currentTopicLabel = document.getElementById('currentTopic');
        const welcomeMsg = document.getElementById('welcomeMessage');
        const loadingMsg = document.getElementById('loadingMessage');
        const pageWrapper = document.getElementById('pageWrapper');

        // Populate Sidebar
        topics.forEach((topic, index) => {
            const li = document.createElement('li');
            const btn = document.createElement('button');
            btn.className = 'topic-btn';
            btn.innerText = topic.name.replace(/_/g, ' ');
            btn.onclick = () => loadPDF(topic.pdf, btn, topic.name);
            li.appendChild(btn);
            topicList.appendChild(li);
        });

        async function loadPDF(url, btnElement, topicName) {
            // Update UI
            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            currentTopicLabel.innerText = topicName.replace(/_/g, ' ');

            welcomeMsg.style.display = 'none';
            pageWrapper.classList.remove('active');
            loadingMsg.style.display = 'block';

            // Reset state
            pdfDoc = null;
            pageNum = 1;

            try {
                pdfDoc = await pdfjsLib.getDocument(encodeURI(url)).promise;
                loadingMsg.style.display = 'none';
                pageWrapper.classList.add('active');
                renderPage(pageNum);
            } catch (error) {
                console.error('Error loading PDF:', error);
                loadingMsg.innerText = 'Error loading PDF';
            }
        }

        function renderPage(num) {
            pageRendering = true;

            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            // Update page counters
            pageInfo.textContent = `Page ${num} of ${pdfDoc.numPages}`;

            prevBtn.disabled = num <= 1;
            nextBtn.disabled = num >= pdfDoc.numPages;
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        function zoomIn() {
            scale = Math.min(scale * 1.2, 3);
            if (pdfDoc) renderPage(pageNum);
        }

        function zoomOut() {
            scale = Math.max(scale / 1.2, 0.5);
            if (pdfDoc) renderPage(pageNum);
        }

        prevBtn.addEventListener('click', onPrevPage);
        nextBtn.addEventListener('click', onNextPage);
        document.getElementById('zoomIn').addEventListener('click', zoomIn);
        document.getElementById('zoomOut').addEventListener('click', zoomOut);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!pdfDoc) return;
            switch (e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    onPrevPage();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    onNextPage();
                    break;
                case '+':
                case '=':
                    e.preventDefault();
                    zoomIn();
                    break;
                case '-':
                    e.preventDefault();
                    zoomOut();
                    break;
            }
        });
    </script>
