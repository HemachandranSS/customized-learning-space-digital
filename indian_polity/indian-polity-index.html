        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar for topics */
        .sidebar {
            width: 300px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            font-size: 1.2rem;
            font-weight: 600;
            position: sticky;
            top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .topic-list {
            list-style: none;
            padding: 1rem 0;
        }

        .topic-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
        }

        .topic-btn:hover,
        .topic-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-left-color: #667eea;
        }

        /* Main View Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .zoom-controls {
            display: flex;
            gap: 0.5rem;
        }

        .zoom-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .viewer-container {
            flex: 1;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
            position: relative;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .page-wrapper {
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
            display: none;
            position: relative;
        }

        .page-wrapper.active {
            display: block;
        }

        /* Transparent overlay to prevent direct canvas access */
        .page-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #pdfCanvas {
            pointer-events: none;
            -webkit-user-drag: none;
            transition: opacity 0.15s ease;
        }

        /* Spotify Section */
        .audio-section {
            padding: 1rem 2rem;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .audio-section iframe {
            border-radius: 12px;
            width: 100%;
            height: 152px;
        }

        .welcome-message {
            text-align: center;
            padding: 4rem;
            opacity: 0.8;
            font-size: 1.2rem;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .progress-bar-container {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            margin: 0.8rem auto 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            width: 0%;
            transition: width 0.2s ease;
        }

        .page-wrapper {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Skeleton shimmer */
        .skeleton-shimmer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s ease-in-out infinite;
            z-index: 5;
            border-radius: 4px;
            display: none;
        }

        .skeleton-shimmer.active {
            display: block;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Hamburger Button */
        .hamburger-btn {
            display: none;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            padding: 0.4rem 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .hamburger-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Sidebar backdrop */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;

        .sidebar-backdrop.active {

        }

        /* Block printing */
        @media print {

        @media (max-width: 768px) {
            .hamburger-btn {

            .title {

                white-space: nowrap;

            .controls {

                font-size: 0.8rem;

                padding: 0.3rem 0.7rem;

            .viewer-container {

            .audio-section {

            }

            .audio-section iframe {

            }

            .viewer-container {
                padding: 0.5rem;
            }

            .welcome-message {
                padding: 2rem 1rem;
                font-size: 1rem;
            }

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.0;
        const LOW_RES_SCALE = 0.4;
        const pdfCache = {};
        let currentPdfUrl = '';
        let loadGeneration = 0;

        // === LRU Page Cache (max 30 entries) ===
        const LRU_MAX = 30;
        const lruKeys = [];
        const renderedPageCache = {};
        function lruSet(key, value) {
            const idx = lruKeys.indexOf(key);
            if (idx !== -1) lruKeys.splice(idx, 1);
            lruKeys.push(key);
            renderedPageCache[key] = value;
            while (lruKeys.length > LRU_MAX) {
                const old = lruKeys.shift();
                delete renderedPageCache[old];
            }
        }
        function lruGet(key) {
            const idx = lruKeys.indexOf(key);
            if (idx === -1) return null;
            lruKeys.splice(idx, 1);
            lruKeys.push(key);
            return renderedPageCache[key];
        }

        // === Canvas Pool (reuse offscreen canvases) ===
        const canvasPool = [];
        function getPooledCanvas() {
            return canvasPool.pop() || document.createElement('canvas');
        }
        function returnCanvas(c) {
            if (canvasPool.length < 5) canvasPool.push(c);
        }

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        canvas.style.imageRendering = 'auto';

        // DOM Elements
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const topicList = document.getElementById('topicList');
        const currentTopicLabel = document.getElementById('currentTopic');
        const welcomeMsg = document.getElementById('welcomeMessage');
        const loadingMsg = document.getElementById('loadingMessage');
        const pageWrapper = document.getElementById('pageWrapper');
        const skeleton = document.getElementById('skeletonShimmer');
        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const viewerContainer = document.getElementById('viewerContainer');

        // === Responsive: Auto-scale PDF to container width ===
        function getAutoScale(page) {
            const containerW = viewerContainer.clientWidth - 32; // padding
            const defaultVP = page.getViewport({ scale: 1.0 });
            if (window.innerWidth <= 768 || defaultVP.width > containerW) {
                return Math.min(containerW / defaultVP.width, 2.0);
            }
            return scale;
        }

        // === Hamburger Sidebar Toggle ===
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarBackdrop.classList.toggle('active');
        }
        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarBackdrop.classList.remove('active');
        }
        hamburgerBtn.addEventListener('click', toggleSidebar);
        sidebarBackdrop.addEventListener('click', closeSidebar);

        // Populate Sidebar
        topics.forEach((topic) => {
            const li = document.createElement('li');
            const btn = document.createElement('button');
            btn.className = 'topic-btn';
            btn.innerText = topic.name.replace(/_/g, ' ');
            btn.onclick = () => {
                loadPDF(topic.pdf, btn, topic.name, topic.spotify_link);
                closeSidebar();
            };
            li.appendChild(btn);
            topicList.appendChild(li);
        });

        function pageCacheKey(url, num, s) {
            return `${url}:${num}:${s.toFixed(2)}`;
        }

        async function loadPDF(url, btnElement, topicName, spotifyLink) {
            const myGeneration = ++loadGeneration;

            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            currentTopicLabel.innerText = topicName.replace(/_/g, ' ');

            welcomeMsg.style.display = 'none';
            pageWrapper.classList.remove('active');
            skeleton.classList.remove('active');

            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');

            pdfDoc = null;
            pageNum = 1;
            pageRendering = false;
            pageNumPending = null;

            // Update Spotify
            const spotifyPlayer = document.getElementById('spotifyPlayer');
            if (spotifyLink) {
                const embedUrl = spotifyLink.replace('open.spotify.com/', 'open.spotify.com/embed/').split('?')[0] + '?utm_source=generator';
                spotifyPlayer.src = embedUrl;
            } else {
                spotifyPlayer.src = 'https://open.spotify.com/embed/playlist/37i9dQZF1DWZeKCadgRdKQ?utm_source=generator';
            }

            const encodedUrl = encodeURI(url);
            currentPdfUrl = encodedUrl;

            // Cached PDF — instant
            if (pdfCache[encodedUrl]) {
                pdfDoc = pdfCache[encodedUrl];
                pageWrapper.classList.add('active');
                renderPage(pageNum);
                return;
            }

            loadingMsg.style.display = 'block';
            loadingText.textContent = 'Loading...';
            progressBar.style.width = '0%';

            try {
                const loadingTask = pdfjsLib.getDocument({
                    url: encodedUrl,
                    disableRange: false,
                    disableStream: false,
                    rangeChunkSize: 65536,
                    disableFontFace: true,
                    cMapPacked: true,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                    standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
                });
                loadingTask.onProgress = (progress) => {
                    if (myGeneration !== loadGeneration) return;
                    if (progress.total > 0) {
                        const pct = Math.round((progress.loaded / progress.total) * 100);
                        progressBar.style.width = pct + '%';
                    }
                };
                const doc = await loadingTask.promise;
                if (myGeneration !== loadGeneration) return;

                pdfDoc = doc;
                pdfCache[encodedUrl] = doc;
                loadingMsg.style.display = 'none';
                pageWrapper.classList.add('active');
                renderPage(pageNum);
            } catch (error) {
                if (myGeneration !== loadGeneration) return;
                console.error('Error loading PDF:', error);
                loadingText.textContent = 'Error loading PDF';
                progressBar.style.width = '0%';
            }
        }

        // Render page to pooled offscreen canvas
        async function renderToCanvas(doc, num, renderScale) {
            const page = await doc.getPage(num);
            const viewport = page.getViewport({ scale: renderScale });
            const offscreen = getPooledCanvas();
            offscreen.width = viewport.width;
            offscreen.height = viewport.height;
            const offCtx = offscreen.getContext('2d');
            await page.render({ canvasContext: offCtx, viewport }).promise;
            return { canvas: offscreen, width: viewport.width, height: viewport.height };
        }

        function displayOnCanvas(result, displayWidth, displayHeight) {
            canvas.width = displayWidth;
            canvas.height = displayHeight;
            ctx.drawImage(result.canvas, 0, 0, displayWidth, displayHeight);
        }

        // Prefetch adjacent pages with requestIdleCallback
        const scheduleIdle = window.requestIdleCallback || ((cb) => setTimeout(cb, 100));
        function prefetchPages(num, doc, url, gen) {
            const pages = [];
            if (num + 1 <= doc.numPages) pages.push(num + 1);
            if (num - 1 >= 1) pages.push(num - 1);
            if (num + 2 <= doc.numPages) pages.push(num + 2);
            if (num + 3 <= doc.numPages) pages.push(num + 3);

            pages.forEach(p => {
                const key = pageCacheKey(url, p, scale);
                if (!renderedPageCache[key]) {
                    scheduleIdle(() => {
                        if (gen !== loadGeneration) return;
                        if (!renderedPageCache[key]) {
                            renderToCanvas(doc, p, scale).then(result => {
                                if (gen === loadGeneration) {
                                    lruSet(key, result);
                                }
                            }).catch(() => { });
                        }
                    });
                }
            });
        }

        async function renderPage(num) {
            pageRendering = true;
            const myGeneration = loadGeneration;
            const myDoc = pdfDoc;
            const myUrl = currentPdfUrl;

            // Auto-scale on mobile
            const firstPage = await myDoc.getPage(num);
            if (myGeneration !== loadGeneration) { pageRendering = false; return; }
            const effectiveScale = getAutoScale(firstPage);
            scale = effectiveScale;

            const fullKey = pageCacheKey(myUrl, num, scale);

            // Update UI
            pageInfo.textContent = `Page ${num} of ${myDoc.numPages}`;
            prevBtn.disabled = num <= 1;
            nextBtn.disabled = num >= myDoc.numPages;

            // CASE 1: Cached — instant display
            const cached = lruGet(fullKey);
            if (cached) {
                skeleton.classList.remove('active');
                displayOnCanvas(cached, cached.width, cached.height);
                canvas.style.opacity = '1';
                pageRendering = false;
                if (pageNumPending !== null) {
                    const p = pageNumPending; pageNumPending = null;
                    renderPage(p);
                }
                prefetchPages(num, myDoc, myUrl, myGeneration);
                return;
            }

            // Show skeleton shimmer
            const fullViewport = firstPage.getViewport({ scale });
            canvas.width = fullViewport.width;
            canvas.height = fullViewport.height;
            skeleton.classList.add('active');

            // CASE 2: Progressive rendering
            try {
                // Low-res preview
                const lowRes = await renderToCanvas(myDoc, num, LOW_RES_SCALE);
                if (myGeneration !== loadGeneration) { pageRendering = false; return; }
                displayOnCanvas(lowRes, fullViewport.width, fullViewport.height);
                returnCanvas(lowRes.canvas);
                canvas.style.opacity = '1';
                skeleton.classList.remove('active');

                // Full quality
                const fullRes = await renderToCanvas(myDoc, num, scale);
                if (myGeneration !== loadGeneration) { pageRendering = false; return; }
                lruSet(fullKey, fullRes);
                displayOnCanvas(fullRes, fullRes.width, fullRes.height);

                pageRendering = false;
                if (pageNumPending !== null) {
                    const p = pageNumPending; pageNumPending = null;
                    renderPage(p);
                }
            } catch (err) {
                if (myGeneration === loadGeneration) console.error('Render error:', err);
                skeleton.classList.remove('active');
                pageRendering = false;
            }

            if (myGeneration === loadGeneration) {
                prefetchPages(num, myDoc, myUrl, myGeneration);
            }
        }

        function queueRenderPage(num) {
            if (pageRendering) { pageNumPending = num; } else { renderPage(num); }
        }

        function onPrevPage() { if (pageNum <= 1) return; pageNum--; queueRenderPage(pageNum); }
        function onNextPage() { if (!pdfDoc || pageNum >= pdfDoc.numPages) return; pageNum++; queueRenderPage(pageNum); }
        function zoomIn() { scale = Math.min(scale * 1.2, 3); if (pdfDoc) renderPage(pageNum); }
        function zoomOut() { scale = Math.max(scale / 1.2, 0.5); if (pdfDoc) renderPage(pageNum); }

        prevBtn.addEventListener('click', onPrevPage);
        nextBtn.addEventListener('click', onNextPage);
        document.getElementById('zoomIn').addEventListener('click', zoomIn);
        document.getElementById('zoomOut').addEventListener('click', zoomOut);

        // === Touch Swipe Navigation ===
        let touchStartX = 0;
        let touchStartY = 0;
        viewerContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        viewerContainer.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].screenX - touchStartX;
            const dy = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                if (dx < 0) onNextPage();
                else onPrevPage();
            }
        }, { passive: true });

        // === Debounced Resize Handler ===
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (pdfDoc) renderPage(pageNum);
            }, 250);
        });

        // Keyboard navigation + download prevention
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u'].includes(e.key.toLowerCase())) {
                e.preventDefault(); e.stopPropagation(); return false;
            }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j'].includes(e.key.toLowerCase())) {
                e.preventDefault(); e.stopPropagation(); return false;
            }
            if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
            if (e.key === 'PrintScreen') { e.preventDefault(); return false; }
            if (!pdfDoc) return;
            switch (e.key) {
                case 'ArrowLeft': e.preventDefault(); onPrevPage(); break;
                case 'ArrowRight': e.preventDefault(); onNextPage(); break;
                case '+': case '=': e.preventDefault(); zoomIn(); break;
                case '-': e.preventDefault(); zoomOut(); break;
            }
        });

        document.addEventListener('dragstart', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => e.preventDefault());
    </script>
